name: Export and Build iOS App

on:
  push:
    branches:
      - main
  workflow_dispatch: # Permite ejecutar el flujo manualmente desde GitHub

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 1. Configurar la versión de Godot
      - name: Setup Godot Engine
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.1
          use-dotnet: false
          include-templates: true

      # 2. Exportar el proyecto desde Godot a Xcode
      - name: Export Godot Project to Xcode
        run: |
          mkdir -p build/ios
          godot --headless --verbose --export-release "iOS" build/ios/bfdiparallels.xcodeproj

      # 3. Configurar Xcode
      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      # 4. Compilar el proyecto exportado usando xcodebuild
      - name: Build iOS App with Xcode
        run: |
          cd build/ios
          xcodebuild build \
            -project bfdiparallels.xcodeproj \
            -scheme bfdiparallels \
            -sdk iphoneos \
            -configuration Release \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      # 5. Empaquetar la app compilada en un archivo .ipa
      - name: Package App into .ipa
        run: |
          cd build/ios
          
          # 1. Localizar la app compilada por Xcode
          APP_PATH=$(find $HOME/Library/Developer/Xcode/DerivedData -name "bfdiparallels.app" | head -n 1)
          echo "App encontrada en: $APP_PATH"
          
          # 2. Crear la estructura Payload
          mkdir -p Payload
          cp -r "$APP_PATH" Payload/
          
          # 3. Copiar el archivo .pck dentro de la app
          cp bfdiparallels.pck Payload/bfdiparallels.app/
          
          # 4. Crear el archivo .ipa
          zip -r bfdiparallels.ipa Payload

      # 6. Guardar el archivo .ipa resultante como artefacto
      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: bfdiparallels-ipa
          path: build/ios/bfdiparallels.ipa
